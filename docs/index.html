<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>比伯斯教学资源中心</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="mark">B</span><div><strong>比伯斯教学资源中心</strong><small>Beavers Education Teaching Resource</small></div></div><span class="top-label">教师端</span></header>
<main><section id="gate" class="gate card"><div class="eyebrow">TEACHING RESOURCE CENTER</div><h1>让每一节课，<br>都有更好的准备。</h1><p>输入教师统一密码，查看最新教学资料。</p><form id="unlock"><label>访问密码<input id="password" type="password" required autocomplete="current-password" placeholder="请输入统一密码"></label><button>进入资源中心 →</button></form><p id="gateError" class="error" role="alert"></p></section>
<div id="app" hidden><section class="hero"><div><div class="eyebrow">BEAVERS EDUCATION</div><h1>教学资源，随时就绪。</h1><p>查找、阅读和打印最新版本的教学资料。</p></div><div class="hero-stat"><b id="count">0</b><span>份可用资源</span></div></section>
<div class="columns"><section class="card"><div class="section-head"><div><span class="eyebrow">LATEST</span><h2>最近更新</h2></div></div><div id="updates"></div></section><section class="card"><div class="section-head"><div><span class="eyebrow">NOTICE</span><h2>管理员公告</h2></div></div><div id="notices"></div></section></div>
<section class="library"><div class="section-head"><div><span class="eyebrow">LIBRARY</span><h2>资源库</h2></div></div><div class="filters"><input id="search" type="search" placeholder="搜索资源名称、教材、单元、课型…"><select id="book"><option value="">全部教材</option></select><select id="category"><option value="">全部类别</option></select><select id="unit"><option value="">全部单元</option></select><select id="lesson"><option value="">全部课型</option></select></div><div id="resources" class="resource-grid"></div></section></div></main>
<div id="viewer" class="viewer" hidden><div class="viewer-bar"><strong id="viewerTitle"></strong><div><span id="pageStatus"></span><button id="printBtn">打印 PDF</button><button id="downloadBtn">下载 PDF</button><button id="closeBtn" aria-label="关闭">×</button></div></div><div id="pages" class="pages"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="app.js"></script></body></html>
